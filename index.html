<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DragonPass / LoungeKey</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface:  #0F1117;
      --card:     rgba(255,255,255,0.06);
      --card-bd:  rgba(255,255,255,0.1);
      --ink:      #F0EEE8;
      --ink2:     #9B97A0;
      --ink3:     #5A5760;
      --ok:       #4ADE80;
      --ok-bg:    rgba(74,222,128,0.08);
      --ok-bd:    rgba(74,222,128,0.25);
      --no:       #F87171;
      --no-bg:    rgba(248,113,113,0.08);
      --no-bd:    rgba(248,113,113,0.25);
      --sans:     'IBM Plex Sans', sans-serif;
      --mono:     'IBM Plex Mono', monospace;
    }

    body {
      background: var(--surface);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      overflow: hidden;
      position: relative;
    }

    /* ── Aurora background ── */
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      mix-blend-mode: screen;
      animation: drift linear infinite;
      opacity: 0.55;
    }

    .b1 { width: 520px; height: 520px; background: #3B1FA8; top: -160px; left: -80px;  animation-duration: 22s; animation-delay: 0s; }
    .b2 { width: 400px; height: 400px; background: #0E6E8A; top: 10%;   right: -100px; animation-duration: 28s; animation-delay: -8s; }
    .b3 { width: 460px; height: 300px; background: #6B21A8; bottom: -80px; left: 20%;  animation-duration: 18s; animation-delay: -4s; }
    .b4 { width: 300px; height: 300px; background: #0D4F6C; bottom: 5%;  right: 5%;   animation-duration: 24s; animation-delay: -12s; }
    .b5 { width: 200px; height: 200px; background: #7C3AED; top: 40%;   left: 40%;   animation-duration: 16s; animation-delay: -6s; }

    @keyframes drift {
      0%   { transform: translate(0, 0)   scale(1); }
      33%  { transform: translate(40px, -30px) scale(1.08); }
      66%  { transform: translate(-30px, 20px) scale(0.95); }
      100% { transform: translate(0, 0)   scale(1); }
    }

    /* subtle noise overlay */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Layout ── */
    .wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 22px;
      padding: 0 2px;
    }

    .logo-name {
      font-family: var(--mono);
      font-size: 17px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.2px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--ink3);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .plane-box {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
    }

    .plane-box svg { color: rgba(255,255,255,0.9); }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--card-bd);
      border-radius: 20px;
      padding: 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ink2);
      margin-bottom: 7px;
    }

    .field-ctrl { position: relative; }

    select, input[type="date"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 16px;
      padding: 13px 40px 13px 16px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s, background 0.15s;
    }

    select:focus, input[type="date"]:focus {
      border-color: rgba(124,58,237,0.6);
      background: rgba(255,255,255,0.08);
    }

    select option { background: #1a1a2e; color: var(--ink); }

    .field-ctrl::after {
      content: '↓';
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--ink3);
      font-size: 11px;
      pointer-events: none;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.6);
      cursor: pointer;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 20px 0;
    }

    /* ── Results ── */
    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .result-block {
      border-radius: 12px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .result-block.ok { border-color: var(--ok-bd); background: var(--ok-bg); }
    .result-block.no { border-color: var(--no-bd); background: var(--no-bg); }

    .rb-head { display: flex; align-items: center; justify-content: space-between; }

    .rb-tag {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .result-block.ok .rb-tag { color: var(--ok); }
    .result-block.no .rb-tag { color: var(--no); }

    .rb-copy {
      background: none;
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      padding: 3px 5px;
      display: flex;
      align-items: center;
      color: var(--ink3);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .result-block.ok .rb-copy:hover { color: var(--ok); border-color: var(--ok-bd); background: rgba(74,222,128,0.1); }
    .result-block.no .rb-copy:hover { color: var(--no); border-color: var(--no-bd); background: rgba(248,113,113,0.1); }
    .rb-copy:disabled { opacity: 0.25; cursor: default; }

    .rb-sub {
      font-size: 10px;
      letter-spacing: 0.03em;
    }

    .result-block.ok .rb-sub { color: rgba(74,222,128,0.55); }
    .result-block.no .rb-sub { color: rgba(248,113,113,0.55); }

    .rb-value {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.7;
      white-space: pre;
    }

    .result-block.ok .rb-value { color: var(--ok); }
    .result-block.no .rb-value { color: var(--no); }
    .rb-value.empty { color: var(--ink3); font-size: 16px; white-space: normal; }

    /* ── Copy all ── */
    .copy-all {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 11px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      backdrop-filter: blur(8px);
    }

    .copy-all:hover { background: rgba(255,255,255,0.16); }
    .copy-all:active { transform: scale(0.98); }
    .copy-all:disabled { opacity: 0.25; cursor: default; transform: none; }

    /* ── Footer ── */
    .foot {
      text-align: center;
      font-size: 11px;
      color: var(--ink3);
      letter-spacing: 0.04em;
      margin-top: 16px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(15,17,23,0.9);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--ink);
      padding: 7px 18px;
      border-radius: 100px;
      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: 0.03em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 99;
      backdrop-filter: blur(12px);
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- Aurora -->
<div class="aurora">
  <div class="aurora-blob b1"></div>
  <div class="aurora-blob b2"></div>
  <div class="aurora-blob b3"></div>
  <div class="aurora-blob b4"></div>
  <div class="aurora-blob b5"></div>
</div>
<div class="noise"></div>

<div class="wrap">
  <div class="header">
    <div>
      <div class="logo-name">DragonPass / LoungeKey</div>
      <div class="logo-sub">Калькулятор транзакцій</div>
    </div>
    <div class="plane-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label class="field-label">Тип картки</label>
      <div class="field-ctrl">
        <select id="cardType">
          <option value="Visa">Visa</option>
          <option value="MasterCard">MasterCard</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Дата вильоту</label>
      <div class="field-ctrl">
        <input type="date" id="flightDate">
      </div>
    </div>

    <hr>

    <div class="results">
      <div class="result-block ok" id="rbOk">
        <div class="rb-head">
          <span class="rb-tag">✓ Зараховується</span>
          <button class="rb-copy" id="copyOk" disabled title="Копіювати">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div class="rb-sub">від 10 000 грн</div>
        <div class="rb-value empty" id="valOk">—</div>
      </div>

      <div class="result-block no" id="rbNo">
        <div class="rb-head">
          <span class="rb-tag">✗ Не зараховується</span>
          <button class="rb-copy" id="copyNo" disabled title="Копіювати">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div class="rb-sub">надто близько до вильоту</div>
        <div class="rb-value empty" id="valNo">—</div>
      </div>
    </div>

    <button class="copy-all" id="copyAll" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Копіювати все
    </button>
  </div>

  <div class="foot">Транзакції повинні зарахуватись до дати вильоту</div>
</div>

<div class="toast" id="toast">Скопійовано</div>

<script>
  const cardType = document.getElementById('cardType');
  const flightDate = document.getElementById('flightDate');
  const valOk = document.getElementById('valOk');
  const valNo = document.getElementById('valNo');
  const copyOk = document.getElementById('copyOk');
  const copyNo = document.getElementById('copyNo');
  const copyAll = document.getElementById('copyAll');
  const toast = document.getElementById('toast');

  const now = new Date();
  flightDate.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  let state = { okText: '', noText: '', card: '' };

  function fmt(d) {
    return [String(d.getDate()).padStart(2,'0'), String(d.getMonth()+1).padStart(2,'0'), d.getFullYear()].join('.');
  }

  function shift(str, n) {
    const d = new Date(str);
    d.setDate(d.getDate() + n);
    return d;
  }

  function calc() {
    if (!flightDate.value) return;
    let s, e;
    if (cardType.value === 'Visa') {
      s = shift(flightDate.value, -35);
      e = shift(flightDate.value, -6);
    } else {
      e = shift(flightDate.value, -8);
      s = new Date(e);
      s.setDate(e.getDate() - 29);
    }

    const noStart = new Date(e); noStart.setDate(e.getDate() + 1);
    const noEnd = new Date(flightDate.value);

    state = {
      okText: `${fmt(s)} — ${fmt(e)}`,
      noText: `${fmt(noStart)} — ${fmt(noEnd)}`,
      card: cardType.value
    };

    valOk.textContent = `${fmt(s)} —\n${fmt(e)}`;
    valNo.textContent = `${fmt(noStart)} —\n${fmt(noEnd)}`;
    valOk.classList.remove('empty');
    valNo.classList.remove('empty');
    copyOk.disabled = false;
    copyNo.disabled = false;
    copyAll.disabled = false;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function flashBtn(btn) {
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    setTimeout(() => { btn.innerHTML = orig; }, 1500);
  }

  copyOk.addEventListener('click', () => {
    navigator.clipboard.writeText(`Треба витратити від 10 000 грн у період: ${state.okText}`)
      .then(() => { flashBtn(copyOk); showToast('Скопійовано'); });
  });

  copyNo.addEventListener('click', () => {
    navigator.clipboard.writeText(`З ${state.noText.replace(' — ', ' по ')} витрати не рахуватимуться`)
      .then(() => { flashBtn(copyNo); showToast('Скопійовано'); });
  });

  copyAll.addEventListener('click', () => {
    navigator.clipboard.writeText(`Треба витратити від 10 000 грн у період: ${state.okText}\nА з ${state.noText.replace(' — ', ' по ')} витрати не рахуватимуться`)
      .then(() => showToast('Все скопійовано ✓'));
  });

  cardType.addEventListener('change', calc);
  flightDate.addEventListener('change', calc);
  calc();
</script>
</body>
</html>
